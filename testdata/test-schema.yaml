openapi: "3.0.3"
info:
  title: Test API
  version: "1.0.0"
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      responses:
        "200":
          description: OK
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      summary: Get a widget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    Test:
      type: object
      description: A test schema that should be flagged
      properties:
        id:
          type: string
    ValidSchema:
      type: object
      description: A valid schema
      properties:
        name:
          type: string
