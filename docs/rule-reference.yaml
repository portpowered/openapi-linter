    shared schema shapes and backend contract tests. Schema inspection cannot prove runtime behavior.
  example:
    language: yaml
    bad: '/v2/WidgetGroups: {}

      '
    good: '/v2/widget-groups: {}

      '
    explanation: Literal path segments must be lowercase kebab case.
portos.query-graph:
  summary: Requires Query request query fields to reference the canonical recursive Query graph with comparison,
    boolean and text-match operators.
  parameters:
    query-schema: Canonical recursive query schema name; default Query.
  example-options:
    query-schema: Query
  notes: See [Portos response contracts](../portos-api.md) and [rule packs](../rule-packs.md) for composition,
    shared schema shapes and backend contract tests. Schema inspection cannot prove runtime behavior.
  example:
    language: yaml
    bad: 'properties: {query: {type: string}}

      '
    good: 'properties: {query: {$ref: ''#/components/schemas/Query''}}

      '
    explanation: The query field must reference the configured recursive Query graph. The canonical graph
      must declare its required operator structures.
portos.query-request:
  summary: Requires classified Query operations to use POST with an object request body.
  parameters: {}
  example-options: {}
  notes: See [Portos response contracts](../portos-api.md) and [rule packs](../rule-packs.md) for composition,
    shared schema shapes and backend contract tests. Schema inspection cannot prove runtime behavior.
  example:
    language: yaml
    bad: 'get: {operationId: QueryWidgets}

      '
    good: "post:\n  operationId: QueryWidgets\n  requestBody:\n    content:\n      application/json:\n\
      \        schema: {type: object}\n"
    explanation: Query must use POST and take an object request body.
portos.query-sorts:
  summary: Checks optional sorts fields in Query request graphs for arrays of closed objects containing
    required direction and key.
  parameters:
    sorts-field: Optional Query sort-array property name; default sorts.
  example-options:
    sorts-field: sorts
  notes: See [Portos response contracts](../portos-api.md) and [rule packs](../rule-packs.md) for composition,
    shared schema shapes and backend contract tests. Schema inspection cannot prove runtime behavior.
  example:
    language: yaml
    bad: 'sorts: {type: array, items: {type: string}}

      '
    good: "sorts:\n  type: array\n  items:\n    type: object\n    additionalProperties: false\n    required:\
      \ [direction, key]\n    properties:\n      direction: {type: string, enum: [ASCENDING, DESCENDING]}\n\
      \      key: {type: string}\n"
    explanation: Sort items must be closed objects with exactly the required direction and key fields.
portos.success-status:
  summary: Requires a 200 or 202 success response and rejects other declared 2xx success statuses.
  parameters: {}
  example-options: {}
  notes: See [Portos response contracts](../portos-api.md) and [rule packs](../rule-packs.md) for composition,
    shared schema shapes and backend contract tests. Schema inspection cannot prove runtime behavior.
  example:
