schema.no-anonymous-objects:
  summary: Requires nested object structures in standalone schemas to be named through references rather
    than declared anonymously.
  parameters: {}
  example-options: {}
  notes: Use --kind schema when linting standalone YAML or JSON schemas. See [getting started](../getting-started.md).
  example:
    language: yaml
    bad: "properties:\n  address:\n    type: object\n    properties: {city: {type: string}}\n"
    good: "properties:\n  address: {$ref: '#/definitions/Address'}\n"
    explanation: Nested object structures must use named references rather than inline anonymous objects.
schema.property-camel-case:
  summary: Requires standalone schema property names to use camelCase.
